<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Movie Shelf</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#978F66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Movie Shelf">
<style>
:root{--bg:#1E201E;--card:#3C3D37;--tx:#ECDFCC;--mu:#9CB080;--ac:#ECDFCC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
.view{display:none;padding:14px}.view.on{display:block}
h2{margin:4px 0 12px}
input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #6B7556;background:var(--card);color:var(--tx);width:100%;margin-bottom:10px}
button{background:var(--ac);color:#111;border:0;font-weight:600}
button.sec{background:var(--card);color:var(--tx);border:1px solid #6B7556}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.item{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:10px;margin-bottom:10px;border:1px solid #9CB080}
.item img,.ph{width:60px;height:90px;object-fit:cover;border-radius:6px;background:#6B7556;flex:none}
.item .t{font-weight:600}.item .m{color:var(--mu);font-size:14px}
.item button{width:auto;padding:3px 10px;font-size:12px;margin:6px 0 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#5c6040;border-top:1px solid #5c6040;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--mu);border-radius:0;margin:0;border:0;padding:16px 4px}
nav button.on{color:var(--ac)}
#reader{width:100%;margin-bottom:10px}
.note{color:var(--mu);font-size:14px;margin:6px 0 12px}
.rr{display:flex;align-items:center;font-size:14px;color:var(--mu);margin-top:2px}
.who{width:56px}
.st{font-size:22px;line-height:1;color:#6B7556;padding:2px 4px}
.st.on{color:#E8C468}
.st.mine{cursor:pointer}
.vr{display:inline-block;margin-top:6px;font-size:12px;color:var(--mu);opacity:.55;text-decoration:underline;cursor:pointer}
.dup{background:#7f1d1d;border:1px solid #ef4444;border-radius:12px;padding:12px;margin-bottom:12px}
.dup button{margin:10px 0 0}
</style></head><body>

<div id="v-coll" class="view on">
  <h2>our collection<span id="count" class="m" style="font-size:14px;color:var(--mu)"></span></h2>
  <input id="filter" placeholder="search here!">
  <select id="sort"></select>
  <div id="list"></div>
</div>

<div id="v-add" class="view">
  <h2>add a movie</h2>
  <select id="fmt"><option>DVD</option><option>Blu-ray</option><option>4K UHD</option><option>Digital</option></select>
  <button id="scanBtn">scan</button>
  <div id="reader"></div>
  <div id="dup"></div>
  <div id="status" class="note"></div>
  <input id="q" placeholder="…or type a title" enterkeyhint="search">
  <button class="sec" id="searchBtn">search</button>
  <div id="results"></div>
</div>

<div id="v-set" class="view">
  <h2>settings &amp; backup</h2>
  <p class="note"></p>
  <input id="key" placeholder="Paste API key">
  <button id="saveKey">save</button>
  <p class="note">who are you? (for star ratings)</p>
  <select id="me"></select>
  <hr style="border-color:#6B7556;margin:18px 0">
  <input id="db" placeholder="Shared collection link (Firebase URL)">
  <button id="saveDb">connect</button>
  <button id="invite" class="sec">copy invite link for a friend</button>
  <div id="syncst" class="note"></div>
  <hr style="border-color:#6B7556;margin:18px 0">
  <button id="exp" class="sec">export backup</button>
  <button id="impBtn" class="sec">import backup</button>
  <input id="imp" type="file" accept=".json" style="display:none">
</div>

<nav><button data-v="coll" class="on">♡ our collection ♡</button><button data-v="add">add movie</button><button data-v="set">⚙</button></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let movies=[];try{movies=JSON.parse(localStorage.getItem('movies')||'[]')}catch(e){}
let apiKey=localStorage.getItem('tmdb')||'';
const save=()=>localStorage.setItem('movies',JSON.stringify(movies));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let scanner=null,lastUPC='';
let dbUrl=localStorage.getItem('db')||'';
const PEOPLE=['glenn','peter'];
const shown=new Set(); // movies whose ratings are currently revealed (resets on reload)
let sortBy=localStorage.getItem('sort')||'title';
const rate=(m,p)=>(m.ratings&&m.ratings[p])||0;
const avg=m=>{const r=PEOPLE.map(p=>rate(m,p)).filter(Boolean);return r.length?r.reduce((a,b)=>a+b,0)/r.length:0};
function cmp(a,b){
  if(sortBy==='new')return b.uid-a.uid;
  let x,y;
  if(sortBy==='avg'){x=avg(a);y=avg(b)}
  else if(PEOPLE.includes(sortBy)){x=rate(a,sortBy);y=rate(b,sortBy)}
  else return a.title.localeCompare(b.title);
  return (y-x)||a.title.localeCompare(b.title);
}
let me=localStorage.getItem('me')||'';
const stars=m=>PEOPLE.map(p=>{
  const r=(m.ratings&&m.ratings[p])||0;
  return `<div class="rr"><span class="who">${p}:</span>${[1,2,3,4,5].map(n=>`<span class="st${n<=r?' on':''}${p===me?' mine':''}" data-rate="${m.uid}" data-who="${p}" data-n="${n}">★</span>`).join('')}</div>`;
}).join('');

// ---- navigation
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button,.view').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$('#v-'+b.dataset.v).classList.add('on');
  if(b.dataset.v!=='add')stopScan();
});

// ---- collection
function render(){
  const f=$('#filter').value.toLowerCase();
  const l=movies.filter(m=>m.title.toLowerCase().includes(f)).sort(cmp);
  $('#count').textContent='('+movies.length+')';
  $('#list').innerHTML=l.map(m=>`<div class="item">${m.poster?`<img src="https://image.tmdb.org/t/p/w185${m.poster}" loading="lazy">`:'<div class="ph"></div>'}
  <div><div class="t">${esc(m.title)}</div><div class="m">${esc(m.year)} · ${esc(m.format)}</div>
  <div><span class="vr" data-vr="${m.uid}">${shown.has(String(m.uid))?'hide ratings':'view ratings'}</span></div>
  ${shown.has(String(m.uid))?stars(m):''}
  ${shown.has(String(m.uid))?`<button class="sec" data-del="${m.uid}">remove</button>`:''}</div></div>`).join('')||'<p class="note">nothing here</p>';
}
$('#filter').oninput=render;
$('#list').addEventListener('click',e=>{
  const id=e.target.dataset.vr;if(!id)return;
  if(shown.has(id))shown.delete(id);else shown.add(id);
  render();
});
$('#sort').innerHTML='<option value="title">sort: a to z</option><option value="new">sort: recently added</option><option value="avg">sort: average rating</option>'+PEOPLE.map(p=>`<option value="${p}">sort: ${p}'s rating</option>`).join('');
$('#sort').value=sortBy;
$('#sort').onchange=()=>{sortBy=$('#sort').value;localStorage.setItem('sort',sortBy);render()};
$('#me').innerHTML='<option value="">choose…</option>'+PEOPLE.map(p=>`<option value="${p}">${p}</option>`).join('');
$('#me').value=me;
$('#me').onchange=()=>{me=$('#me').value;localStorage.setItem('me',me);render()};
$('#list').addEventListener('click',async e=>{
  const t=e.target;if(!t.dataset.rate)return;
  if(!me){alert('Pick who you are in settings first.');return}
  if(t.dataset.who!==me)return;
  const m=movies.find(x=>x.uid==t.dataset.rate);if(!m)return;
  const n=+t.dataset.n;
  const val=((m.ratings&&m.ratings[me])||0)===n?null:n;
  if(dbUrl){try{const r=await fetch(dbUrl+'/movies/'+m.uid+'/ratings.json',{method:'PATCH',body:JSON.stringify({[me]:val})});if(!r.ok)throw 0}catch(err){alert("Couldn't save your rating. Check your connection.");return}}
  m.ratings=m.ratings||{};
  if(val===null)delete m.ratings[me];else m.ratings[me]=val;
  save();render();
});
$('#list').onclick=async e=>{
  const id=e.target.dataset.del;
  if(id&&confirm('u sure?')){
    if(dbUrl){try{const r=await fetch(dbUrl+'/movies/'+id+'.json',{method:'DELETE'});if(!r.ok)throw 0}catch(err){alert("Couldn't update the shared collection. Check your connection.");return}}
    movies=movies.filter(m=>m.uid!=id);save();render();
  }
};

// ---- scanning
function stopScan(){if(scanner){scanner.stop().catch(()=>{});scanner=null;$('#scanBtn').textContent='scan'}}
$('#scanBtn').onclick=async()=>{
  if(scanner){stopScan();return}
  if(typeof Html5Qrcode==='undefined'){$('#status').textContent='Scanner library not loaded (need internet the first time).';return}
  scanner=new Html5Qrcode('reader');
  $('#scanBtn').textContent='stop scanning';
  try{
    await scanner.start({facingMode:'environment'},
      {fps:10,qrbox:{width:280,height:140},formatsToSupport:[Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.EAN_8]},
      code=>{if(code===lastUPC&&!scanner)return;lastUPC=code;stopScan();lookupUPC(code)});
  }catch(e){$('#status').textContent='Camera error: '+e+' — check camera permission.';stopScan()}
};
const clean=t=>t.replace(/[\(\[].*?[\)\]]/g,' ').replace(/\b(blu-?ray|dvd|4k|uhd|ultra hd|digital|hd|widescreen|special edition|steelbook|combo pack|disc|bd|movie)\b/gi,' ').replace(/[+\/:-]\s*$/,'').replace(/\s+/g,' ').trim();
async function lookupUPC(code){
  $('#dup').innerHTML='';$('#results').innerHTML='';
  const have=movies.filter(m=>m.upc===code);
  if(have.length){
    const m=have[0];
    $('#status').textContent='';
    $('#dup').innerHTML=`<div class="dup"><b>You already have a copy.</b><br>${esc(m.title)} (${esc(m.year)}) · ${esc(m.format)}${have.length>1?' · '+have.length+' copies':''}<button class="sec" id="dismissDup">Dismiss</button></div>`;
    $('#dismissDup').onclick=()=>{$('#dup').innerHTML='';$('#status').textContent='Dismissed. Scan the next one!'};
    return;
  }
  $('#status').textContent='Scanned '+code+' — looking it up…';
  try{
    const d=await getJSON('https://api.upcitemdb.com/prod/trial/lookup?upc='+code);
    const t=d.items&&d.items[0]&&d.items[0].title;
    if(t){$('#q').value=clean(t);$('#status').textContent='Barcode says: "'+t+'". Pick the right match below (edit the title and search again if needed).';searchTMDB()}
    else $('#status').textContent='Barcode '+code+' not found. Type the title instead.';
  }catch(e){
    $('#status').textContent=(e==='limit'?'Daily lookup limit reached.':'Lookup failed ('+(navigator.onLine?'online':'offline')+', '+e+').')+' Type the title instead.';
  }
}
// tries the direct request first, then two free relay services (the barcode site blocks direct browser requests)
async function getJSON(url){
  const tries=[url,'https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?url='+encodeURIComponent(url)];
  let err='unknown';
  for(const u of tries){
    try{
      const r=await fetch(u);
      if(r.status===429){err='limit';continue}
      return await r.json();
    }catch(e){err=e&&e.message?e.message:String(e)}
  }
  throw err;
}

// ---- TMDB search
async function searchTMDB(){
  const q=$('#q').value.trim();if(!q)return;
  if(!apiKey){$('#status').textContent='Add your TMDB API key in Settings first.';return}
  $('#results').innerHTML='<p class="note">Searching…</p>';
  try{
    const r=await fetch('https://api.themoviedb.org/3/search/movie?api_key='+encodeURIComponent(apiKey)+'&query='+encodeURIComponent(q));
    const d=await r.json();
    if(!d.results){$('#results').innerHTML='<p class="note">Error: '+esc(d.status_message||'unknown')+'</p>';return}
    window._res=d.results.slice(0,8);
    $('#results').innerHTML=window._res.map((m,i)=>`<div class="item">${m.poster_path?`<img src="https://image.tmdb.org/t/p/w185${m.poster_path}">`:'<div class="ph"></div>'}
    <div><div class="t">${esc(m.title)}</div><div class="m">${esc((m.release_date||'').slice(0,4))}</div><button data-add="${i}">Add to collection</button></div></div>`).join('')||'<p class="note">No matches.</p>';
  }catch(e){$('#results').innerHTML='<p class="note">Search failed — are you online?</p>'}
}
$('#searchBtn').onclick=searchTMDB;
$('#q').onkeydown=e=>{if(e.key==='Enter')searchTMDB()};
$('#results').onclick=async e=>{
  const i=e.target.dataset.add;if(i===undefined)return;
  const m=window._res[i];
  const mv={uid:Date.now(),id:m.id,title:m.title,year:(m.release_date||'').slice(0,4),poster:m.poster_path||'',overview:m.overview||'',format:$('#fmt').value,upc:lastUPC||''};
  if(dbUrl){try{const r=await fetch(dbUrl+'/movies/'+mv.uid+'.json',{method:'PUT',body:JSON.stringify(mv)});if(!r.ok)throw 0}catch(err){alert("Couldn't save to the shared collection. Check your connection.");return}}
  movies.push(mv);
  save();render();lastUPC='';
  $('#results').innerHTML='';$('#q').value='';$('#status').textContent='Added "'+m.title+'". Scan the next one!';
};

// ---- settings / backup
$('#key').value=apiKey;
$('#saveKey').onclick=()=>{apiKey=$('#key').value.trim();localStorage.setItem('tmdb',apiKey);alert('Saved')};
$('#exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(movies,null,1)],{type:'application/json'}));
  a.download='movie-shelf-backup.json';a.click();
};
$('#impBtn').onclick=()=>$('#imp').click();
$('#imp').onchange=async e=>{
  try{const d=JSON.parse(await e.target.files[0].text());
    if(Array.isArray(d)&&confirm('Replace your collection with '+d.length+' movies from this file?')){movies=d;save();render()}
  }catch(err){alert('That file could not be read.')}
};

// ---- shared collection (Firebase Realtime Database over plain web requests)
function setSync(t){$('#syncst').textContent=t}
async function sync(){
  if(!dbUrl){setSync('Not connected. This collection is only on this device.');return}
  try{
    const r=await fetch(dbUrl+'/movies.json');
    if(!r.ok)throw new Error('status '+r.status);
    const d=await r.json()||{};
    movies=Object.values(d).filter(Boolean);
    save();render();
    setSync('Connected. Last synced '+new Date().toLocaleTimeString()+'.');
  }catch(e){setSync('Could not reach the shared collection ('+e.message+'). Showing the last saved copy.')}
}
async function connect(u){
  u=u.trim().replace(/\/+$/,'');
  if(!/^https:\/\/.+/.test(u)){alert('That does not look like a database link. It should start with https://');return false}
  try{
    const r=await fetch(u+'/movies.json');
    if(!r.ok)throw new Error('status '+r.status+' (check the database rules)');
    const cloud=await r.json()||{};
    const extra=movies.filter(m=>!cloud[m.uid]);
    if(extra.length&&confirm('Upload '+extra.length+' movie(s) from this device to the shared collection? (Cancel = they will be replaced by the shared list.)')){
      const body={};extra.forEach(m=>body[m.uid]=m);
      const p=await fetch(u+'/movies.json',{method:'PATCH',body:JSON.stringify(body)});
      if(!p.ok)throw new Error('upload failed, status '+p.status);
    }
    dbUrl=u;localStorage.setItem('db',u);$('#db').value=u;
    await sync();
    return true;
  }catch(e){alert('Could not connect: '+e.message);return false}
}
$('#db').value=dbUrl;
$('#saveDb').onclick=async()=>{if(await connect($('#db').value))alert('Connected!')};
$('#invite').onclick=async()=>{
  if(!dbUrl){alert('Connect to the shared collection first.');return}
  const link=location.origin+location.pathname+'#db='+encodeURIComponent(dbUrl)+'&key='+encodeURIComponent(apiKey);
  try{await navigator.clipboard.writeText(link);alert('Invite link copied. Send it to your friend and have them open it.')}
  catch(e){prompt('Copy this invite link:',link)}
};
setInterval(sync,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
(async()=>{
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('db')){
    if(h.get('key')){apiKey=h.get('key');localStorage.setItem('tmdb',apiKey);$('#key').value=apiKey}
    history.replaceState(null,'',location.pathname);
    await connect(h.get('db'));
  }else sync();
})();

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
